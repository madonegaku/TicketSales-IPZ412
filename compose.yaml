# Система продажу квитків: шлюз, три сервіси з власними даними, брокер подій (ЛР 3–5)
# та інтерфейс користувачів на Meteor (ADR-006).
# Запуск: docker compose up --build
#   http://localhost:8090/ – інтерфейс із ролями (web); http://localhost:8080/ – сторінки Django ЛР 2–5.

x-auth-secret: &auth-secret
  # Секрет підпису токенів доступу web → sales, tickets (ADR-006); значення – лише для розробки.
  AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:-dev-only-change-me-ticketsales-web-token}

services:
  gateway:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
      - "8090:8090"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - sales
      - tickets
      - web

  web:
    build: ./web
    environment:
      <<: *auth-secret
      MONGO_URL: mongodb://web-db:27017/web
      ROOT_URL: http://localhost:8090
      SALES_API_URL: http://sales:8000/api/v1
      TICKETS_API_URL: http://tickets:8000/api/v1
      # Перший адміністратор і демо-користувачі ролей – лише для розробки й демонстрації.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@ticketsales.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin-dev-password}
      SEED_DEMO_USERS: ${SEED_DEMO_USERS:-1}
    depends_on:
      - web-db
      - sales
      - tickets

  # Власна база web: облікові записи й ролі (ADR-006). Інші сервіси до неї не звертаються.
  web-db:
    image: mongo:7
    volumes:
      - web-data:/data/db

  sales:
    build:
      context: .
      args:
        SERVICE: sales
    command: python -m django runserver 0.0.0.0:8000 --noreload --settings=sales.config.settings
    # Лише localhost: JSON API для Meteor, запущеного на машині розробника (meteor run, ADR-006).
    ports:
      - "127.0.0.1:8100:8000"
    environment:
      <<: *auth-secret
      PAYMENTS_URL: http://payments:8000
      REDIS_URL: redis://redis:6379/0
      SALES_DATABASE_URL: postgresql://sales:sales@sales-db:5432/sales
      # Час життя кешу схеми залу, с; для вимірювання без кешу: $env:HALL_LAYOUT_CACHE_TTL=0
      HALL_LAYOUT_CACHE_TTL: ${HALL_LAYOUT_CACHE_TTL:-30}
    depends_on:
      payments:
        condition: service_started
      redis:
        condition: service_started
      sales-db:
        condition: service_healthy

  payments:
    build:
      context: .
      args:
        SERVICE: payments
    command: python -m django runserver 0.0.0.0:8000 --noreload --settings=payments.config.settings
    environment:
      PAYMENTS_DB_PATH: /data/payments.sqlite3
    volumes:
      - payments-data:/data

  tickets:
    build:
      context: .
      args:
        SERVICE: tickets
    command: python -m django runserver 0.0.0.0:8000 --noreload --settings=tickets.config.settings
    # Лише localhost: JSON API для Meteor, запущеного на машині розробника (meteor run, ADR-006).
    ports:
      - "127.0.0.1:8200:8000"
    environment:
      <<: *auth-secret
      TICKETS_DB_PATH: /data/tickets.sqlite3
      REDIS_URL: redis://redis:6379/0
    volumes:
      - tickets-data:/data
    depends_on:
      - redis

  tickets-consumer:
    build:
      context: .
      args:
        SERVICE: tickets
    command: python -m tickets.config.consumer
    environment:
      TICKETS_DB_PATH: /data/tickets.sqlite3
      REDIS_URL: redis://redis:6379/0
    volumes:
      - tickets-data:/data
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data

  # Власна база sales (ЛР 5, ADR-002): до неї підключається лише sales.
  # Порт 5433 на localhost – для інтеграційних тестів і psql з хоста розробника.
  sales-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sales
      POSTGRES_USER: sales
      POSTGRES_PASSWORD: sales
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - sales-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sales -d sales"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  web-data:
  sales-data:
  payments-data:
  tickets-data:
  redis-data: