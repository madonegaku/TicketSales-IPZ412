asyncapi: 3.0.0
info:
  title: Подія OrderPaid (sales → tickets)
  version: 1.0.0
  description: |
    Контракт асинхронної взаємодії (ЛР 3). Продуцент – sales, споживач – tickets.
    Подія фіксує факт, що вже стався: замовлення оплачено.

    Гарантії:
    - Доставка щонайменше один раз: sales записує подію у вихідну чергу (outbox) в одній
      локальній транзакції зі статусом «оплачене»; окремий процес публікує її в Redis Streams;
      споживач підтверджує обробку (XACK) лише після видачі квитків.
    - Повторна доставка можлива: споживач обробляє подію ідемпотентно за order_id.
    - Порядок: у межах потоку події надходять у порядку публікації.
    - Продуцент не чекає результату обробки й не залежить від кількості споживачів.

    Версіонування: версія – у назві потоку та в полі schema_version. Сумісна зміна в межах
    версії 1 – лише нові необов'язкові поля; споживачі ігнорують невідомі поля. Несумісна
    зміна – нова версія схеми в новому потоці (sales.order-paid.v2); на час переходу
    продуцент публікує обидві версії.
servers:
  redis:
    host: redis:6379
    protocol: redis
    description: Redis 7 (Streams) у мережі Docker Compose
channels:
  orderPaid:
    address: sales.order-paid.v1
    description: Потік Redis Streams; група споживачів tickets
    messages:
      orderPaid:
        $ref: "#/components/messages/OrderPaid"
operations:
  publishOrderPaid:
    action: send
    channel:
      $ref: "#/channels/orderPaid"
    summary: sales публікує подію після підтвердження оплати замовлення
  issueTickets:
    action: receive
    channel:
      $ref: "#/channels/orderPaid"
    summary: tickets видає квитки на всі місця оплаченого замовлення
components:
  messages:
    OrderPaid:
      name: OrderPaid
      title: Замовлення оплачено
      contentType: application/json
      payload:
        $ref: "#/components/schemas/OrderPaidV1"
      examples:
        - name: two-seats
          summary: Оплачено два місця в партері
          payload:
            message_id: 7f1c2b9e-3a4d-4e5f-8a6b-1c2d3e4f5a6b
            message_type: OrderPaid
            schema_version: 1
            occurred_at: "2026-11-04T18:30:00Z"
            order_id: 2b8e4c1a-9d7f-4a3e-b5c6-0f1e2d3c4b5a
            event_id: 00000000-0000-0000-0000-000000000018
            event_title: Концерт симфонічного оркестру
            event_starts_at: "2026-12-20T17:00:00Z"
            seats:
              - sector: Партер
                row: 3
                number: 7
              - sector: Партер
                row: 3
                number: 8
  schemas:
    OrderPaidV1:
      type: object
      required:
        - message_id
        - message_type
        - schema_version
        - occurred_at
        - order_id
        - event_id
        - event_title
        - event_starts_at
        - seats
      properties:
        message_id:
          type: string
          format: uuid
          description: Унікальний ідентифікатор повідомлення – для журналів і трасування
        message_type:
          const: OrderPaid
        schema_version:
          const: 1
        occurred_at:
          type: string
          format: date-time
          description: Момент підтвердження оплати в sales (UTC)
        order_id:
          type: string
          format: uuid
          description: Замовлення в sales; ключ ідемпотентності споживача
        event_id:
          type: string
          format: uuid
          description: Захід (Event) у sales – квиток дійсний лише на нього
        event_title:
          type: string
          minLength: 1
        event_starts_at:
          type: string
          format: date-time
          description: Час початку заходу (UTC) – для правил входу
        seats:
          type: array
          minItems: 1
          maxItems: 6
          items:
            $ref: "#/components/schemas/Seat"
    Seat:
      type: object
      required: [sector, row, number]
      properties:
        sector:
          type: string
          minLength: 1
        row:
          type: integer
          minimum: 1
        number:
          type: integer
          minimum: 1