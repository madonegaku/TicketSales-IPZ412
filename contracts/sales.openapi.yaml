openapi: 3.1.0
info:
  title: Сервіс продажу (sales) – API для інтерфейсу web
  version: 1.0.0
  description: |
    JSON API сервісу sales для сервісу web на Meteor (ADR-006). Клієнт – лише сервер web у
    внутрішній мережі Docker; шлюз закриває шлях /api/ ззовні. Сторінки Django sales (ЛР 2–5)
    цим контрактом не описуються.

    Автентифікація: кожен запит несе заголовок «Authorization: Bearer <JWT>», підписаний web
    (HS256, спільний секрет): sub – subjectId користувача (UUID), roles – ролі (buyer, organizer,
    inspector, admin), iss = web, aud = ticketsales, строк дії – 5 хвилин. Покупець завжди діє від
    власного імені: buyer_id береться з токена, а не з тіла запиту.

    Гарантії:
    - Резервування атомарне: усі обрані місця або жодне; одне місце не продається двічі (С-03).
    - Оплата: повтор після 503 безпечний – платіжний сервіс ідемпотентний за order_id (С-04, С-05).
    - Чуже замовлення для покупця «не знайдене» (404), щоб не розкривати його існування.
    - Суми – рядки з двома знаками після коми (без помилок округлення), час – ISO 8601 з поясом.

    Версіонування: версія в шляху (/api/v1); додавання необов'язкових полів – сумісна зміна,
    клієнт ігнорує невідомі поля; видалення чи перейменування – лише /api/v2.
servers:
  - url: http://sales:8000/api/v1
    description: Внутрішня мережа Docker Compose
security:
  - bearerAuth: []
paths:
  /events:
    get:
      operationId: listEvents
      summary: Афіша – усі заходи за часом початку
      responses:
        "200":
          description: Список заходів
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events:
                    type: array
                    items: {$ref: "#/components/schemas/EventSummary"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
  /events/{event_id}:
    get:
      operationId: getHallLayout
      summary: Схема залу заходу зі станом місць
      parameters:
        - {$ref: "#/components/parameters/EventId"}
      responses:
        "200":
          description: Схема залу
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HallLayout"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "404": {$ref: "#/components/responses/Error"}
  /events/{event_id}/reservations:
    post:
      operationId: reserveSeats
      summary: Зарезервувати місця від імені покупця (роль buyer)
      parameters:
        - {$ref: "#/components/parameters/EventId"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ReservationRequest"}
      responses:
        "201":
          description: Місця зарезервовано, створено замовлення
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Reservation"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409":
          description: Порушено правило продажу (seat_not_available, reservation_limit, sales_not_started)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /orders:
    get:
      operationId: listMyOrders
      summary: Замовлення покупця, новіші першими (роль buyer)
      responses:
        "200":
          description: Замовлення покупця
          content:
            application/json:
              schema:
                type: object
                required: [orders]
                properties:
                  orders:
                    type: array
                    items: {$ref: "#/components/schemas/Order"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Error"}
  /orders/{order_id}:
    get:
      operationId: getMyOrder
      summary: Одне замовлення покупця (роль buyer); чуже – 404
      parameters:
        - {$ref: "#/components/parameters/OrderId"}
      responses:
        "200":
          description: Замовлення
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Order"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /orders/{order_id}/payment:
    post:
      operationId: payOrder
      summary: Оплатити власне замовлення (роль buyer)
      parameters:
        - {$ref: "#/components/parameters/OrderId"}
      responses:
        "200":
          description: Оплату виконано; квитки видасть сервіс tickets після події OrderPaid
          content:
            application/json:
              schema:
                type: object
                required: [order_id, status]
                properties:
                  order_id: {type: string, format: uuid}
                  status: {const: PAID}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "402":
          description: Банк відхилив платіж (payment_declined); замовлення знову очікує оплати
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409":
          description: Строк резервування минув або замовлення вже оплачене
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "503":
          description: Платіжний сервіс не відповів (payment_unavailable); оплата в обробці, повтор безпечний
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    EventId:
      name: event_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    OrderId:
      name: order_id
      in: path
      required: true
      schema: {type: string, format: uuid}
  responses:
    Unauthenticated:
      description: Немає дійсного токена (unauthenticated, invalid_token, token_expired)
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Error:
      description: Помилка з машиночитним кодом
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
  schemas:
    Money:
      type: string
      pattern: "^[0-9]+\\.[0-9]{2}$"
      examples: ["600.00"]
    EventSummary:
      type: object
      required: [event_id, title, sales_start, starts_at, seats_total, seats_available, price_from, currency]
      properties:
        event_id: {type: string, format: uuid}
        title: {type: string, minLength: 1}
        sales_start: {type: string, format: date-time}
        starts_at: {type: string, format: date-time}
        seats_total: {type: integer, minimum: 0}
        seats_available: {type: integer, minimum: 0}
        price_from: {$ref: "#/components/schemas/Money"}
        currency: {type: string, pattern: "^[A-Z]{3}$"}
    HallLayout:
      type: object
      required: [event_id, title, seats]
      properties:
        event_id: {type: string, format: uuid}
        title: {type: string}
        seats:
          type: array
          items:
            type: object
            required: [sector, row, number, category, price, currency, is_available]
            properties:
              sector: {type: string, minLength: 1}
              row: {type: integer, minimum: 1}
              number: {type: integer, minimum: 1}
              category: {type: string}
              price: {$ref: "#/components/schemas/Money"}
              currency: {type: string, pattern: "^[A-Z]{3}$"}
              is_available: {type: boolean}
    SeatRef:
      type: object
      required: [sector, row, number]
      properties:
        sector: {type: string, minLength: 1}
        row: {type: integer, minimum: 1}
        number: {type: integer, minimum: 1}
    ReservationRequest:
      type: object
      required: [seats]
      properties:
        seats:
          type: array
          minItems: 1
          maxItems: 6
          items: {$ref: "#/components/schemas/SeatRef"}
    Reservation:
      type: object
      required: [order_id, total_amount, currency, pay_until]
      properties:
        order_id: {type: string, format: uuid}
        total_amount: {$ref: "#/components/schemas/Money"}
        currency: {type: string, pattern: "^[A-Z]{3}$"}
        pay_until: {type: string, format: date-time}
    Order:
      type: object
      required: [order_id, event_id, event_title, status, total_amount, currency, payment_deadline, seats]
      properties:
        order_id: {type: string, format: uuid}
        event_id: {type: string, format: uuid}
        event_title: {type: string}
        status: {enum: [AWAITING_PAYMENT, PAYMENT_PENDING, PAID]}
        total_amount: {$ref: "#/components/schemas/Money"}
        currency: {type: string, pattern: "^[A-Z]{3}$"}
        payment_deadline: {type: string, format: date-time}
        seats:
          type: array
          items:
            type: object
            required: [sector, row, number, price]
            properties:
              sector: {type: string}
              row: {type: integer, minimum: 1}
              number: {type: integer, minimum: 1}
              price: {$ref: "#/components/schemas/Money"}
    Error:
      type: object
      required: [code, message]
      properties:
        code: {type: string, pattern: "^[a-z_]+$"}
        message: {type: string}
