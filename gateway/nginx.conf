# Шлюз – єдина точка входу: браузер бачить одну адресу й не знає про поділ на сервіси.
# Сервіс payments ззовні недоступний – його викликає лише sales усередині мережі Compose.
# JSON API sales і tickets (/api/) ззовні закрито – його викликає лише сервер web (ADR-006).
server {
    listen 80;

    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 2s;
    proxy_read_timeout 10s;

    location /api/ {
        return 404;
    }

    location /validate/ {
        proxy_pass http://tickets:8000;
    }

    location /tickets/ {
        proxy_pass http://tickets:8000;
    }

    location / {
        proxy_pass http://sales:8000;
    }
}

# Інтерфейс користувачів на Meteor (ADR-006): http://localhost:8090/
# Meteor тримає з браузером постійне з'єднання WebSocket (DDP), тому потрібні заголовки Upgrade
# і довгий тайм-аут читання.
server {
    listen 8090;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_connect_timeout 2s;
    proxy_read_timeout 1h;

    location / {
        proxy_pass http://web:3000;
    }
}
