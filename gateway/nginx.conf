# Шлюз – єдина точка входу: браузер бачить одну адресу й не знає про поділ на сервіси.
# Сервіс payments ззовні недоступний – його викликає лише sales усередині мережі Compose.
server {
    listen 80;

    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 2s;
    proxy_read_timeout 10s;

    location /validate/ {
        proxy_pass http://tickets:8000;
    }

    location /tickets/ {
        proxy_pass http://tickets:8000;
    }

    location / {
        proxy_pass http://sales:8000;
    }
}