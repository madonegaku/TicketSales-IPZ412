[tool.importlinter]
root_package = "sales"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Шари ядра: presentation | infrastructure → application → domain"
type = "layers"
layers = [
    "sales.presentation | sales.infrastructure",
    "sales.application",
    "sales.domain",
]

[[tool.importlinter.contracts]]
name = "Домен і застосунок не залежать від Django"
type = "forbidden"
source_modules = ["sales.domain", "sales.application"]
forbidden_modules = ["django"]